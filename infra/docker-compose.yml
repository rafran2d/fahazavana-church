# Environnement de développement local.
# Lancer depuis la racine : docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: fahazavana

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    # minio/minio n'est plus publié sur Docker Hub : image Chainguard équivalente
    image: cgr.dev/chainguard/minio:latest  # TODO: figer un tag testé avant la démo
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Crée le bucket privé au premier démarrage
  minio-init:
    # minio/mc n'est plus publié sur Docker Hub
    image: bitnamilegacy/minio-client:latest
    user: "0"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET};
      mc anonymous set none local/${S3_BUCKET};
      "

  livekit:
    image: livekit/livekit-server:latest  # TODO: figer la version testée
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  egress:
    image: livekit/egress:latest  # TODO: figer la version testée
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    depends_on:
      - livekit
      - redis

  api:
    build: ../apps/api
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - "3000:3000"

  ai-worker:
    build: ../apps/ai-worker
    env_file: ../.env
    depends_on:
      - redis
      - livekit
      - api
    volumes:
      - whispercache:/root/.cache/huggingface
      - ../models:/models

volumes:
  pgdata:
  miniodata:
  whispercache:
