[project]
name = "fahazavana-ai-worker"
version = "0.1.0"
description = "Worker IA : sous-titres live (LiveKit) et transcription/traduction post-live"
requires-python = ">=3.11"
dependencies = [
  "bullmq>=2.7",
  "livekit>=0.17",
  "faster-whisper>=1.0.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "boto3>=1.34",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Traduction auto-hébergée NLLB-200 (couvre le malgache : plt_Latn)
nllb = ["ctranslate2>=4.3", "sentencepiece>=0.2", "transformers>=4.41"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worker", "worker.providers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
